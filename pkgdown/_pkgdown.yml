url: https://nicholasjclark.github.io/mvgam/

authors:
  Nicholas J Clark:
    href: https://ecogambler.netlify.app/

template:
  bootstrap: 5
  bootswatch: pulse

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github]

articles:
- title: Getting started
  desc: >
    Shape your data, then meet the modelling surface that consumes it.
  contents:
  - data
  - mvgam_overview

- title: Latent dynamics
  desc: >
    Trend processes that carry temporal structure the observation model
    cannot see, and the post-fit tools that interrogate them.
  contents:
  - articles/var
  - articles/hierarchical_var
  - dfm

- title: Many responses, one process
  desc: >
    Sharing a latent state across outcomes measured on different
    scales, across species, and across survey protocols.
  contents:
  - articles/mvbf
  - articles/jsdgam
  - articles/idm

- title: Imperfect detection
  desc: >
    Closure-unit families that separate what is there from what was
    seen.
  contents:
  - articles/nmix

- title: Evaluating forecasts
  desc: >
    Scoring rules, rolling-origin cross-validation and ensembles.
  contents:
  - articles/forecast_evaluation

