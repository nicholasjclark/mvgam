# Runs the examples that `R CMD check` skips. The first error fails
# the job.
#
# `\dontrun{}` wraps every example that fits a model. 168 `mvgam()`
# and `jsdgam()` calls across 59 help files would otherwise sample on
# every check. The pkgdown build runs these blocks to show
# their output. It renders an error and carries on. This job stops on
# one. It fits Stan models for hours and runs only when dispatched.
on:
  workflow_dispatch:

name: examples

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    runs-on: ubuntu-latest

    name: run examples (including dontrun)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # cmdstanr is not on CRAN, so install the Suggests the examples
      # need explicitly, matching R-CMD-check.yaml.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: NA
          extra-packages: |
              local::.
              knitr
              extraDistr
              lubridate
              wrswoR
              tweedie
              scoringRules
              matrixStats
              xts
              collapse
              rmarkdown
              ggrepel
              ggpp
              ggarrow
              ape
              mvabund
              future
              bridgesampling
              V8
              stan-dev/cmdstanr
              devtools

      - name: Build Cmdstan
        run: |
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
          cmdstanr::install_cmdstan()
        shell: Rscript {0}

      - name: Run every example, dontrun included
        run: |
          # `run_dontrun = TRUE` is the whole point: these are the
          # blocks `R CMD check` never reaches. A failure here means an
          # example no longer runs against the shipping code, which is
          # what users copy first.
          devtools::run_examples(
            run_donttest = TRUE,
            run_dontrun  = TRUE,
            document     = FALSE
          )
        shell: Rscript {0}
